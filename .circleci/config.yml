version: 2.1

orbs:
  ruby: circleci/ruby@2.5.3
  codecov: codecov/codecov@3
  browser-tools: circleci/browser-tools@2.1.2
  # node: circleci/node@2

jobs:
  build:
    docker:
      - image: cimg/ruby:3.3.5-browsers
    steps:
      - checkout
      - ruby/install:
          version: '3.3.5'
      - ruby/install-deps
      # Store bundle cache
      # - node/install-packages:
      #     pkg-manager: yarn
      #     cache-key: "yarn.lock"

  test:
    parallelism: 3
    docker:
      - image: cimg/ruby:3.3.5-node
      - image: circleci/postgres:9.5-alpine
        environment:
          POSTGRES_USER: teambox
          POSTGRES_DB: teambox_test
          POSTGRES_PASSWORD: ""
    environment:
      BUNDLE_JOBS: "3"
      BUNDLE_RETRY: "3"
      PGHOST: 127.0.0.1
      PGUSER: teambox
      PGPASSWORD: ""
      RAILS_ENV: test

    steps:
      - checkout
      - ruby/install:
          version: '3.3.5'
      - ruby/install-deps
      # - node/install-packages:
      #     pkg-manager: yarn
      #     cache-key: "yarn.lock"
      - run:
          name: Wait for DB
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Database setup
          command: bundle exec rails db:schema:load --trace
      # Run rspec in parallel
      - ruby/rspec-test
      - codecov/upload

  cucumber:
    parallelism: 3
    docker:
      - image: cimg/ruby:3.3.5-node
      - image: circleci/postgres:9.5-alpine
        environment:
          POSTGRES_USER: teambox
          POSTGRES_DB: teambox_test
          POSTGRES_PASSWORD: ""
    environment:
      BUNDLE_JOBS: "3"
      BUNDLE_RETRY: "3"
      PGHOST: 127.0.0.1
      PGUSER: teambox
      PGPASSWORD: ""
      RAILS_ENV: test

    steps:
      - browser-tools/install_chrome
      - browser-tools/install_chromedriver
      - run:
          name: Install system deps
          command: sudo apt-get update && sudo apt-get install -y libvips libvips-dev
      - checkout
      - ruby/install:
          version: '3.3.5'
      - ruby/install-deps
      # - node/install-packages:
      #     pkg-manager: yarn
      #     cache-key: "yarn.lock"
      - run:
          name: Wait for DB
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Database setup
          command: bundle exec rails db:schema:load --trace
      - run:
          name: Run Cucumber tests
          command: |
            circleci tests glob "features/**/*.feature" | circleci tests run --command="xargs bundle exec cucumber --tags 'not @ignore' --retry 2 --retry-total 10 --format junit --out ~/cucumber/junit.xml" --verbose --split-by=timings

      - store_test_results:
          path: ~/cucumber

      - store_artifacts:
          path: /home/circleci/project/tmp/capybara

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
      # test (rspec) disabled - now runs on GitHub CI
      # - test:
      #     requires:
      #       - build
      # cucumber disabled - now runs as parallel matrix on GitHub CI
      # - cucumber:
      #     requires:
      #       - build
