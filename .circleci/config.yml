version: 2.1

orbs:
  ruby: circleci/ruby@2.5.3
  codecov: codecov/codecov@3
  browser-tools: circleci/browser-tools@2.1.2
  # node: circleci/node@2

jobs:
  build:
    docker:
      - image: cimg/ruby:3.3.5-browsers
    steps:
      - checkout
      - ruby/install:
          version: '3.3.5'
      - ruby/install-deps
      # Store bundle cache
      # - node/install-packages:
      #     pkg-manager: yarn
      #     cache-key: "yarn.lock"

  test:
    parallelism: 3
    docker:
      - image: cimg/ruby:3.3.5-node
      - image: circleci/postgres:9.5-alpine
        environment:
          POSTGRES_USER: teambox
          POSTGRES_DB: teambox_test
          POSTGRES_PASSWORD: ""
    environment:
      BUNDLE_JOBS: "3"
      BUNDLE_RETRY: "3"
      PGHOST: 127.0.0.1
      PGUSER: teambox
      PGPASSWORD: ""
      RAILS_ENV: test

    steps:
      - checkout
      - ruby/install:
          version: '3.3.5'
      - ruby/install-deps
      # - node/install-packages:
      #     pkg-manager: yarn
      #     cache-key: "yarn.lock"
      - run:
          name: Wait for DB
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Database setup
          command: bundle exec rails db:schema:load --trace
      # Run rspec in parallel
      - ruby/rspec-test
      - run:
          name: Move coverage to unique dir
          command: |
            mkdir coverage_artifacts
            cp -r coverage coverage_artifacts/rspec
      - persist_to_workspace:
          root: .
          paths:
            - coverage_artifacts/rspec
      # - codecov/upload

  cucumber:
    parallelism: 3
    docker:
      - image: cimg/ruby:3.3.5-node
      - image: circleci/postgres:9.5-alpine
        environment:
          POSTGRES_USER: teambox
          POSTGRES_DB: teambox_test
          POSTGRES_PASSWORD: ""
    environment:
      BUNDLE_JOBS: "3"
      BUNDLE_RETRY: "3"
      PGHOST: 127.0.0.1
      PGUSER: teambox
      PGPASSWORD: ""
      RAILS_ENV: test

    steps:
      - browser-tools/install_chrome
      - browser-tools/install_chromedriver
      - checkout
      - ruby/install:
          version: '3.3.5'
      - ruby/install-deps
      # - node/install-packages:
      #     pkg-manager: yarn
      #     cache-key: "yarn.lock"
      - run:
          name: Wait for DB
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Database setup
          command: bundle exec rails db:schema:load --trace
      # Run rspec in parallel
      - run:
          name: Run Cucumber tests
          command: bundle exec cucumber --tags "not @ignore"
      - run:
          name: Move coverage to unique dir
          command: |
            mkdir coverage_artifacts
            cp -r coverage coverage_artifacts/cucumber
      - persist_to_workspace:
          root: .
          paths:
            - coverage_artifacts/cucumber
  merge-and-upload-coverage:
    docker:
      - image: cimg/ruby:3.3.5
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Combine coverage results
          command: |
            ls -la coverage_artifacts/cucumber
            ls -la coverage_artifacts/rspec
workflows:
  version: 2
  build_and_test:
    jobs:
      - build
      - test:
          requires:
            - build
      - cucumber:
          requires:
            - build
      - merge-and-upload-coverage:
          requires:
            - test
            - cucumber
